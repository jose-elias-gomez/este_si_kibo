<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Console Home</title>

<!-- Fuentes: Fredoka (títulos de apps) + fallback tipo Geist para el resto -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="home.css" />
</head>
<body>

<main class="console" id="console">

  <!-- Marca de agua central -->
  <div class="watermark" aria-hidden="true">
    <!-- Reemplazar por tu logo real, ej: <img src="logo.svg" alt=""> -->
    <svg viewBox="0 0 200 200" class="watermark-svg">
      <circle cx="100" cy="100" r="90" fill="currentColor" opacity="0.5"/>
      <circle cx="100" cy="100" r="50" fill="none" stroke="currentColor" stroke-width="8"/>
    </svg>
  </div>

  <!-- Barra superior -->
  <header class="topbar">
    <div class="status">
      <span class="time">12:18 <span class="ampm">PM</span></span>
      <span class="icon icon-wifi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a10 10 0 0 1 14 0"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
      </span>
      <span class="icon icon-battery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="7" width="18" height="10" rx="2"/><line x1="23" y1="10.5" x2="23" y2="13.5"/><rect x="3.5" y="9.3" width="13" height="5.4" fill="currentColor" stroke="none" rx="1"/></svg>
      </span>
    </div>
  </header>

  <!-- Flecha arriba (solo visible en modo sistema) -->
  <div class="arrow-row">
    <button id="btnUp" class="arrow-btn" aria-label="Volver a las aplicaciones" hidden>
      <svg class="arrow-bounce" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
    </button>
  </div>

  <!-- Slider -->
  <section class="slider-wrap">
    <div id="scrollContainer" class="scroll-container scrollbar-hide">
      <div class="spacer" aria-hidden="true"></div>
      <div id="itemsTrack" class="items-track"></div>
      <div class="spacer" aria-hidden="true"></div>
    </div>
  </section>

  <!-- Flecha abajo (solo visible en modo apps) -->
  <div class="arrow-row">
    <button id="btnDown" class="arrow-btn" aria-label="Abrir opciones del sistema">
      <svg class="arrow-bounce" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-left">
      <span class="icon icon-gamepad">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="11" x2="10" y2="11"/><line x1="8" y1="9" x2="8" y2="13"/><line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/></svg>
      </span>
      <span id="dots" class="dots"></span>
    </div>
    <button id="btnAccept" class="accept-btn">
      <span class="accept-x">X</span>
      <span class="accept-label">Aceptar</span>
    </button>
  </footer>

</main>

<script src="./js/script.js"></script>
</body>
</html>
