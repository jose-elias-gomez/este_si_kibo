<!doctype html>
<html lang="es">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Hub</title>
    <link rel="stylesheet" href="../../shared/css/global.css" />

</head>

<body>
    <div id="app"></div>
    <script type="module">
        import { mountGameHub } from "./js/app.js";

        const app = document.getElementById("app");

        // Acá es donde vuelve al home de tu app. Mismo patrón que usás en

        // input contexts solo) y después navegar.
        mountGameHub(app, () => {
            window.location.href = "../home/home.html";
        });
    </script>
