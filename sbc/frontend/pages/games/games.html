<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>

    <link rel="stylesheet" href="../../shared/css/global.css" />
    <link rel="stylesheet" href="quiz.css" />
    <script src="../movement/libs/gsap.min.js"></script>

    <script src="js/data.js" type="module"></script>
    <script src="js/category-selector.js" type="module"></script>
    <script src="js/difficulty-selector.js" type="module"></script>
    <script src="js/questions-handler.js" type="module"></script>

</head>

<body>
    <div id="category-viewport">
        <ul id="category-list"></ul>
    </div>

    <dialog id="difficulty-selector">
        <strong class="difficulty-header">Seleccionando dificultad</strong>
        <div id="difficulty-container"></div>
        <strong class="difficulty-bottom">Puedes saltearlo usando el mando</strong>
    </dialog>

    <dialog id="question-dialog">
        <header class="question-header">
            <div id="question-timer"><span id="question-time">15</span><small>s</small></div>
            <strong id="question-difficulty"></strong>
        </header>
        <strong id="question-text"></strong>
        <ul id="question-options"></ul>
        <strong class="question-bottom">Toca la pieza para responder</strong>
    </dialog>
</body>

</html>
