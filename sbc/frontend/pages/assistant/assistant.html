<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Virtual</title>

    <link rel="stylesheet" href="../../shared/css/global.css" />
    <link rel="stylesheet" href="assistant.css" />

    <script src="js/inactive.js" type="module"></script>
    <script src="js/processing.js" type="module"></script>
    <script src="js/recording.js" type="module"></script>
</head>

<body>
    <div id="inactive-background">
        <img class="expression-img" src="../../shared/assets/expressions/happy.svg" alt="" />
        <div class="inactive-text">
            <strong>¿Qué esperas?</strong>
            <p>Presiona el botón para hablar</p>
        </div>
    </div>

    <div class="history"></div>

    <button class="record-btn">
        <svg class="record-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="#fff"
            stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            class="icon icon-tabler icons-tabler-outline icon-tabler-microphone" viewBox="0 0 24 24">
            <path fill="none" stroke="none" d="M0 0h24v24H0z" />
            <path d="M9 5a3 3 0 0 1 3-3 3 3 0 0 1 3 3v5a3 3 0 0 1-3 3 3 3 0 0 1-3-3z" />
            <path d="M5 10a7 7 0 0 0 14 0M8 21h8m-4-4v4" />
        </svg>
    </button>

    <dialog id="recording-dialog">

        <p class="up-info">Presiona de vuelta para detener</p>

        <canvas class="wave-canvas"></canvas>

        <div class="mic-visualizer">
            <svg class="recording-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#fff"
                viewBox="0 0 24 24">
                <path fill="none" d="M0 0h24v24H0z" />
                <path
                    d="M19 9a1 1 0 0 1 1 1 8 8 0 0 1-6.999 7.938L13 20h3a1 1 0 0 1 0 2H8a1 1 0 0 1 0-2h3v-2.062A8 8 0 0 1 4 10a1 1 0 1 1 2 0 6 6 0 0 0 12 0 1 1 0 0 1 1-1m-7-8a4 4 0 0 1 4 4v5a4 4 0 1 1-8 0V5a4 4 0 0 1 4-4" />
            </svg>
        </div>
        <div class="dialog-info">
            <strong class="dialog-header">Grabando</strong>
            <div class="dialog-content">
                <p id="timer"></p>
            </div>
        </div>
    </dialog>

    <dialog id="processing-dialog">
        <p class="up-info">Puede tardar si el internet es lento</p>

        <strong class="loader"></strong>

        <div class="dialog-info">
            <strong class="dialog-header">Procesando</strong>
            <div class="dialog-content">
                <p id="timer">Espera un poco</p>
            </div>
        </div>
    </dialog>
</body>

</html>
