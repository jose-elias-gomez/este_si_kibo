<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control 3D de Robot - KiboSimplified</title>
  <!-- El CSS va primero para que @view-transition esté disponible de
       inmediato y no dependa de que las libs pesadas de abajo terminen
       de cargar (eso rompía la transición de salida hacia home.html) -->
  <link rel="stylesheet" href="movement.css">

  <!-- Three.js, GLTFLoader, OrbitControls y GSAP via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script src="../../shared/js/inputController.js" type="module"></script>
  <script src="../../shared/components/sliderbar.js" type="module"></script>
  <script src="js/movement.js" type="module" defer></script>
</head>
<body>

  <div class="app-grid">

    <!-- Barra Izquierda -->
    <aside class="panel sidebar">
      <header>
        <h2>Componentes</h2>
        <p>Elegí una pieza y ajustá su ángulo</p>
      </header>

      <p class="group-label">Cabeza</p>
      <button class="btn-part" data-node="Head" data-view="front">
        <span><span class="icon">◍</span>Cabeza</span>
        <span class="axis-badge">Y</span>
      </button>

      <p class="group-label">Brazos</p>
      <button class="btn-part" data-node="LeftArm" data-view="left">
        <span><span class="icon">↰</span>Izquierdo</span>
        <span class="axis-badge">X</span>
      </button>
      <button class="btn-part" data-node="RightArm" data-view="right">
        <span><span class="icon">↱</span>Derecho</span>
        <span class="axis-badge">X</span>
      </button>

      <p class="group-label">Ruedas</p>
      <button class="btn-part" data-node="LeftWheel" data-view="left">
        <span><span class="icon">◐</span>Izquierda</span>
        <span class="axis-badge">X</span>
      </button>
      <button class="btn-part" data-node="RightWheel" data-view="right">
        <span><span class="icon">◑</span>Derecha</span>
        <span class="axis-badge">X</span>
      </button>

      <button class="btn-reset" id="btn-reset" type="button">↺ Reiniciar posición</button>
    </aside>

    <!-- Espacio Central para Modelo 3D -->
    <main class="panel viewport-3d">
      <div id="canvas-container"></div>
      <div class="status-overlay">Editando: <span id="status-part">—</span></div>
      <div class="hint-overlay">ESC vuelve al home</div>
    </main>

    <!-- Control Inferior -->
    <footer class="panel controls-bottom">
      <div class="slider-container">
        <label for="angle-slider">Ángulo de pivot</label>
        <input
          type="range"
          id="angle-slider"
          min="-45"
          max="45"
          value="0"
          disabled
        >
        <span id="angle-val" class="angle-value">0°</span>
      </div>
    </footer>
  </div>
</body>
</html>
