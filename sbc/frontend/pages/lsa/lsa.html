<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aprendé LSA</title>
  <link rel="stylesheet" href="../../shared/css/global.css" />
  <link rel="stylesheet" href="lsa.css" />
</head>
<body>

  <div class="lsa-page">

    <header class="lsa-header">
      <div class="lsa-topbar">
        <span class="lsa-brand">LSA</span>

        <nav class="lsa-tabs" id="lsa-tabs">
          <button class="lsa-tab" data-category="abecedario">Abecedario</button>
          <button class="lsa-tab" data-category="palabras">Palabras</button>
          <span class="lsa-tabs-indicator" id="lsa-tabs-indicator"></span>
        </nav>
      </div>

      <div class="lsa-hero">
        <h1 id="lsa-hero-title">Abecedario</h1>
        <p id="lsa-hero-meta"></p>
      </div>
    </header>

    <main class="lsa-grid" id="lsa-grid"></main>

    <div class="lsa-detail" id="lsa-detail">
      <div class="lsa-detail-card">
        <video
          id="lsa-detail-video"
          class="lsa-detail-video"
          muted
          loop
          playsinline
          preload="metadata"
        ></video>
        <p class="lsa-detail-index" id="lsa-detail-index"></p>
        <h2 id="lsa-detail-label"></h2>
        <p class="lsa-detail-hint">Flechas para cambiar de seña. Confirmar para pausar. Atrás para cerrar.</p>
      </div>
    </div>

  </div>

  <script type="module" src="js/lsa.js"></script>
</body>
</html>
